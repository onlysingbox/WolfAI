name: Build WOLF AI Android
on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/android.yml"
      - "src/**"
      - "tests/**"
      - "package.json"
      - "migrations/**"
      - "wrangler.toml"
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      WOLF_KEYSTORE_BASE64: ${{ secrets.WOLF_KEYSTORE_BASE64 }}
      WOLF_KEYSTORE_PASSWORD: ${{ secrets.WOLF_KEYSTORE_PASSWORD }}
      WOLF_KEY_ALIAS: wolfai
      WOLF_KEY_PASSWORD: ${{ secrets.WOLF_KEYSTORE_PASSWORD }}
      WOLF_KEYSTORE_FILE: ${{ github.workspace }}/wolf-release.jks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate Worker JavaScript syntax
        run: node --check src/worker.js
      - name: Test mission execution safety boundaries
        run: node --test tests/*.test.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Prepare stable release signing key
        run: |
          test -n "$WOLF_KEYSTORE_BASE64"
          test -n "$WOLF_KEYSTORE_PASSWORD"
          printf '%s' "$WOLF_KEYSTORE_BASE64" | base64 --decode > "$WOLF_KEYSTORE_FILE"
          test -s "$WOLF_KEYSTORE_FILE"
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Build stable signed release APK
        if: always()
        run: gradle --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wolf-ai-agent-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
      - name: Upload stable signed release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wolf-ai-agent-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn
      - name: Android emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_I_WANT_MY_TCG: "yes"
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 1800
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            set +e
            adb logcat -c
            adb install -r app/build/outputs/apk/release/app-release.apk
            INSTALL_STATUS=$?
            if [ "$INSTALL_STATUS" -ne 0 ]; then
              echo "Release APK installation failed"
              exit "$INSTALL_STATUS"
            fi
            adb shell am force-stop com.onlysingbox.wolfai
            adb shell am start -n com.onlysingbox.wolfai/.MainActivity
            sleep 20
            adb logcat -d -t 10000 > /tmp/wolf-logcat.txt
            echo "===== WOLF AI CRASH LOG ====="
            grep -n -A 60 -B 10 -E 'FATAL EXCEPTION|AndroidRuntime|Process: com.onlysingbox.wolfai|WOLF_STARTUP' /tmp/wolf-logcat.txt || true
            echo "===== ACTIVITY STATE ====="
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity|mFocusedApp' || true
            echo "===== PROCESS ====="
            adb shell pidof com.onlysingbox.wolfai || true
            if grep -q 'FATAL EXCEPTION' /tmp/wolf-logcat.txt; then exit 1; fi
            adb shell pidof com.onlysingbox.wolfai >/dev/null
