name: Build WOLF AI Android
on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/android.yml"
      - "src/**"
      - "tests/**"
      - "package.json"
      - "migrations/**"
      - "wrangler.toml"
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      WOLF_KEYSTORE_BASE64: ${{ secrets.WOLF_KEYSTORE_BASE64 }}
      WOLF_KEYSTORE_PASSWORD: ${{ secrets.WOLF_KEYSTORE_PASSWORD }}
      WOLF_KEY_ALIAS: wolfai
      WOLF_KEY_PASSWORD: ${{ secrets.WOLF_KEYSTORE_PASSWORD }}
      WOLF_KEYSTORE_FILE: ${{ github.workspace }}/wolf-release.jks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate Worker JavaScript syntax
        run: node --check src/worker.js
      - name: Test mission execution safety boundaries
        run: node --test tests/*.test.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Prepare stable release signing key
        run: |
          test -n "$WOLF_KEYSTORE_BASE64"
          test -n "$WOLF_KEYSTORE_PASSWORD"
          printf '%s' "$WOLF_KEYSTORE_BASE64" | base64 --decode > "$WOLF_KEYSTORE_FILE"
          test -s "$WOLF_KEYSTORE_FILE"
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Android emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.onlysingbox.wolfai
            adb shell am start -n com.onlysingbox.wolfai/.MainActivity
            sleep 15
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' | grep -q 'com.onlysingbox.wolfai'
            if adb logcat -d -t 3000 | grep -E 'FATAL EXCEPTION|Process: com.onlysingbox.wolfai' | grep -q 'FATAL EXCEPTION'; then
              adb logcat -d -t 3000 | grep -A 30 -B 5 'FATAL EXCEPTION'
              exit 1
            fi
      - name: Build stable signed release APK
        run: gradle --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: wolf-ai-agent-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Upload stable signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: wolf-ai-agent-release
          path: app/build/outputs/apk/release/app-release.apk
