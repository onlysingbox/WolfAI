name: Build WOLF AI Android
on:
  # Release APK creation is deliberately manual. Normal commits run only the
  # Kotlin compile check and Worker safety tests; no APK is packaged/uploaded.
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      WOLF_KEYSTORE_BASE64: ${{ secrets.WOLF_KEYSTORE_BASE64 }}
      WOLF_KEYSTORE_PASSWORD: ${{ secrets.WOLF_KEYSTORE_PASSWORD }}
      WOLF_KEY_ALIAS: wolfai
      WOLF_KEY_PASSWORD: ${{ secrets.WOLF_KEYSTORE_PASSWORD }}
      WOLF_KEYSTORE_FILE: ${{ github.workspace }}/wolf-release.jks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate Worker JavaScript syntax
        run: node --check src/worker.js
      - name: Test mission execution safety boundaries
        run: node --test tests/*.test.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Prepare stable release signing key
        run: |
          test -n "$WOLF_KEYSTORE_BASE64"
          test -n "$WOLF_KEYSTORE_PASSWORD"
          printf '%s' "$WOLF_KEYSTORE_BASE64" | base64 --decode > "$WOLF_KEYSTORE_FILE"
          test -s "$WOLF_KEYSTORE_FILE"
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Build stable signed release APK
        run: gradle --no-daemon assembleRelease
      - name: Verify release APK signature and identity
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          "$APKSIGNER" verify --verbose "$APK"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -name zipalign | sort -V | tail -n 1)"
          test -x "$ZIPALIGN"
          "$ZIPALIGN" -c 4 "$APK"
          unzip -Z1 "$APK" | grep -q "^lib/arm64-v8a/"
          unzip -Z1 "$APK" | grep -q "^lib/armeabi-v7a/"
          test "$(stat -c %s "$APK")" -lt 60000000
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.onlysingbox.wolfai' versionCode='15' versionName='0.6.9'"
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml | grep -F "extractNativeLibs"
          "$AAPT" dump resources "$APK" | grep -F "wolf_logo_photo"
      - uses: actions/upload-artifact@v4
        with:
          name: wolf-ai-agent-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload stable signed release APK (direct APK, no ZIP)
        uses: actions/upload-artifact@v7
        with:
          path: app/build/outputs/apk/release/app-release.apk
          archive: false
          if-no-files-found: error
