name: Android Kotlin compile check
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "build.gradle*"
      - "settings.gradle*"
      - "gradle.properties"
      - "gradle/**"
      - ".github/workflows/android-compile-check.yml"
  workflow_dispatch:
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compile Android Kotlin sources and run local unit tests without packaging an APK
        run: gradle --no-daemon :app:compileDebugKotlin :app:testDebugUnitTest
