name: WOLF AI Worker checks

on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "package.json"
      - "wrangler.toml"
      - "migrations/**"
      - ".github/workflows/worker-check.yml"
  workflow_dispatch:

jobs:
  worker-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Worker syntax
        run: node --check src/worker.js
      - name: Check scheduler syntax
        run: node --check src/scheduler.js
      - name: Run Worker tests
        run: npm test
